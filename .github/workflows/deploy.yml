name: Deploy site

# Builds the al-folio Jekyll site on GitHub's servers and publishes the compiled
# output to the `gh-pages` branch. You do NOT need Ruby/Jekyll installed locally.
#
# One-time setup after the first successful run:
#   Repo Settings -> Pages -> "Build and deployment" -> Source: "Deploy from a branch"
#   -> Branch: gh-pages / (root) -> Save.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a rebuild manually from the Actions tab

permissions:
  contents: write

# Avoid overlapping deploys if you push twice quickly.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true # runs `bundle install` and caches the gems

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
          # Tell GitHub Pages to serve the compiled site as-is (don't re-run Jekyll).
          touch _site/.nojekyll

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js || echo "purgecss skipped; shipping full CSS"

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
